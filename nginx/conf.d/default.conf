server {
  listen 80;
  server_name 13-125-98-203.sslip.io _;
  client_max_body_size 50M;

  # certbot 인증
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # 정적 업로드
  location /static/uploads/ {
    alias /app/uploads/;
  }

  # AI 프록시
  location /ai/ {
    proxy_pass http://ai:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
  }

  # 백엔드 프록시
  location / {
    proxy_pass http://backend:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
  }
}

server {
  listen 443 ssl http2;
  server_name 13-125-98-203.sslip.io;

  ssl_certificate     /etc/letsencrypt/live/13-125-98-203.sslip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/13-125-98-203.sslip.io/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 50M;

  # 정적 업로드
  location /static/uploads/ { alias /app/uploads/; }

  # AI 프록시
  location /ai/ {
    proxy_pass http://ai:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
  }

  # 백엔드 프록시
  location / {
    proxy_pass http://backend:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
  }
}


spring.application.name=seosancomplain

spring.datasource.url=jdbc:mysql://localhost:3306/seosancomplain?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
admin.secret=hanseo
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
ai.base-url=${AI_BASE_URL:http://localhost:8000}
file.upload-dir=uploads
ai.summarizer.base-url=http://localhost:8000
ai.summarizer.endpoint=/summarize
ai.summarizer.timeout-ms=18000000

server.port=8080

spring.datasource.hikari.maximum-pool-size=10

# logging.level.org.hibernate.SQL=debug
# logging.level.org.hibernate.type.descriptor.sql=trace

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.datasource.tomcat.initSQL=SET NAMES 'utf8mb4'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: seosan-ollama

    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  ai:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: seosan-ai
    environment:
      - OLLAMA_BASE=http://ollama:11434
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b-instruct
      - OLLAMA_ALT_MODEL=qwen2.5:3b-instruct
      - COMPOSE_USE_LLM=1
      - EXTRACT_USE_LLM=1
      - CAPTION_ENABLED=0
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seosan-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      ai:
        condition: service_healthy
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: seosan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: seosancomplain
      TZ: Asia/Seoul

    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 8

  nginx:
    image: nginx:alpine
    container_name: seosan-nginx
    depends_on:
      - backend
      - ai
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
      - uploads:/app/uploads:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: seosan-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
volumes:
  mysql_data:
  ollama_data:
  uploads:
  certbot-www:
  letsencrypt:
spring.application.name=seosancomplain
admin.secret=hanseo

logging.level.org.springframework.web.reactive.function.client=DEBUG
logging.level.reactor.netty.http.client=DEBUG
report.base-url=https://minwon.example.go.kr
report.daily-pattern=/reports/daily/{yyyy}/{MM}/{dd}/report_{yyyyMMdd}.pdf
report.monthly-pattern=/reports/monthly/{yyyy}/{MM}/report_{yyyyMM}.pdf
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
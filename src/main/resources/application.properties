spring.application.name=seosancomplain

# --- DataSource (MySQL ?? 127.0.0.1:3306) ---
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/seosancomplain?useSSL=false&sslMode=DISABLED&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect   # ? ??? ?? ?? ? ?? ??

# --- ?? ??? ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- ??????/?? ---
server.port=8080
admin.secret=hanseo
file.upload-dir=uploads

# --- AI ??? ---
ai.base-url=${AI_BASE_URL:http://localhost:8000}
ai.summarizer.base-url=http://localhost:8000
ai.summarizer.endpoint=/summarize
ai.summarizer.timeout-ms=18000000

